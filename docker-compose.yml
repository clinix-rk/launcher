version: "3.9"

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: clinix-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  forge:
    image: ghcr.io/clinix-rk/forge:latest
    container_name: clinix-forge
    pull_policy: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_HOST=postgres-db
      - SPRING_DATASOURCE_PORT=5432
      - SPRING_DATASOURCE_DATABASE=${POSTGRES_DB:-clinix_datastore}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-clinix_application}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-password}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - JWT_SECRET=${JWT_SECRET:-default-secret-change-in-prod}
      - APP_NAME=${APP_NAME:-Clinix}
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/api/v1/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  lens:
    image: ghcr.io/clinix-rk/lens:latest
    container_name: clinix-lens
    pull_policy: always
    ports:
      - "80:80"
    environment:
      - REACT_APP_API_URL=http://forge:8080
      - REACT_APP_ENV=${REACT_APP_ENV:-production}
    depends_on:
      forge:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
