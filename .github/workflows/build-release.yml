name: Build & Release AppLauncher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore src/AppLauncher/
      
      - name: Build
        run: dotnet build -c Release --no-restore src/AppLauncher/
      
      - name: Run tests (if applicable)
        run: dotnet test -c Release --no-build src/AppLauncher/
        continue-on-error: true
      
      - name: Publish self-contained EXE
        run: |
          dotnet publish -c Release -o ./publish `
            --self-contained `
            -p:PublishReadyToRun=true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:SelfContained=true `
            src/AppLauncher/
      
      - name: Get version
        id: version
        run: |
          if ('${{ github.ref }}' -match 'v(.+)') {
            $VERSION = $matches[1]
          } else {
            $VERSION = '${{ github.event.inputs.version }}'.TrimStart('v')
          }
          echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
          echo "Releasing version: $VERSION"
      
      - name: Rename EXE
        run: |
          Copy-Item -Path "publish/AppLauncher.exe" -Destination "publish/AppLauncher-${{ steps.version.outputs.VERSION }}.exe"
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: publish/AppLauncher-${{ steps.version.outputs.VERSION }}.exe
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: AppLauncher-${{ steps.version.outputs.VERSION }}
          path: publish/AppLauncher.exe
          retention-days: 7

  create-release-notes:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract release notes
        run: |
          # Generate release notes from recent commits
          git log --pretty=format:"%h - %s" -5 > RELEASE_NOTES.md
      
      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false